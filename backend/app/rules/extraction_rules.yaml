# ---------------------------------------------------------------------------
# Barrier Status Modifiers & Negations
# ---------------------------------------------------------------------------
barrier_status_modifiers:
  "Not Verified":
    patterns:
      - "without verified"
      - "not verified"
      - "unverified"
      - "no verified"
      - "lacking verification"
      - "verification missing"
      - "not confirmed"
    severity_bias: "critical"

  "Absent":
    patterns:
      - "without"
      - "no"
      - "absent"
      - "not applied"
      - "not used"
      - "not worn"
      - "missing"
      - "not provided"
      - "not performed"
      - "not done"
      - "not conducted"
      - "lacking"
      - "omitted"
      - "not obtained"
      - "not closed"
      - "not locked"
      - "not set up"
      - "not enforced"
    severity_bias: "high"

  "Failed":
    patterns:
      - "failed"
      - "compromised"
      - "broken"
      - "cracked"
      - "inadequate"
      - "defective"
      - "bypassed"
      - "damaged"
      - "unsecured"
    severity_bias: "high"

  "Present":
    patterns:
      - "verified"
      - "in place"
      - "applied"
      - "completed"
      - "performed"
      - "present"
      - "functional"
      - "active"
      - "enforced"
      - "signed off"
      - "signed"
      - "provided"
      - "operated throughout"
      - "satisfactory"
      - "tested"
    severity_bias: "low"

