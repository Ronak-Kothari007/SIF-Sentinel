version: "1.0"
description: >
  SIF Sentinel - Safety Context & Entity Extraction Rules and Gazetteers.
  Provides domain-specific dictionaries, aliases, canonical names, and status modifiers
  for identifying activity, hazard, barrier, barrier status, location, and equipment
  from industrial and oil & gas safety observation texts.
last_updated: "2026-09-11"
schema_version: 1

