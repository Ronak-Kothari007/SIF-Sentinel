services:
  - type: web
    name: sif-sentinel-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    # Disk removed so Render does not require a credit card.
    # Note: SQLite data will reset when the server restarts.
    
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./sif_sentinel.db
      - key: ALLOWED_ORIGINS
        value: '["*"]'
